name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./internal/...

      - name: Integration tests (synthetic)
        run: go test -race -count=1 -timeout 120s -v ./integration/

      - name: Verify module tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  windows:
    name: Windows (${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: windows-latest
            msystem: UCRT64
            cc: gcc
            packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libwebp
          - goarch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            cc: clang
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-libwebp
    defaults:
      run:
        shell: msys2 {0}
    env:
      CGO_ENABLED: "1"
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Prebuilt libwebp from MSYS2 — no cross toolchain, no libwebp source build.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit # so the Go installed below is visible in the MSYS2 shell
          install: ${{ matrix.packages }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # No -race: mingw does not ship the race runtime. The Linux job covers it.
      - name: Unit tests
        run: go test -count=1 ./internal/...

      - name: Integration tests (synthetic)
        run: go test -count=1 -timeout 300s ./integration/

      - name: Set build metadata
        id: meta
        run: |
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # -extldflags=-static pulls libwebp, libsharpyuv and the compiler runtime into
      # the .exe, so the released binary needs no MSYS2 DLLs alongside it.
      - name: Build binaries
        run: |
          for cmd in geotiff2pmtiles pmtransform coginfo; do
            go build \
              -ldflags "-X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.buildDate=${{ steps.meta.outputs.date }} -extldflags=-static" \
              -o dist/$cmd-windows-${{ matrix.goarch }}.exe \
              ./cmd/$cmd/
          done

      # Run it with the MSYS2 bin directory off PATH: a dynamically linked build
      # would fail to start here, so this proves both the static link and that
      # WebP made it into the binary.
      - name: Smoke test
        run: |
          out=$(PATH=/c/Windows/System32 ./dist/geotiff2pmtiles-windows-${{ matrix.goarch }}.exe --version)
          echo "$out"
          echo "$out" | grep -q webp

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-windows-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set build metadata
        id: meta
        run: |
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build geotiff2pmtiles
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.buildDate=${{ steps.meta.outputs.date }}" \
            -o dist/geotiff2pmtiles-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/geotiff2pmtiles/

      - name: Build pmtransform
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.buildDate=${{ steps.meta.outputs.date }}" \
            -o dist/pmtransform-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/pmtransform/

      - name: Build coginfo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.buildDate=${{ steps.meta.outputs.date }}" \
            -o dist/coginfo-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/coginfo/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

  integration-real:
    name: Integration (real satellite data)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache satellite data
        uses: actions/cache@v6
        with:
          path: |
            integration/testdata/copernicus/*.tif
            integration/testdata/naturalearth/*.tif
            integration/testdata/naturalearth/*.tfw
            integration/testdata/naturalearth/*.zip
            integration/testdata/esaworldcover/*.tif
            integration/testdata/esaworldcover-ndvi/*.tif
            integration/testdata/esaworldcover-swir/*.tif
            integration/testdata/esaworldcover-gamma0/*.tif
          key: satellite-data-${{ hashFiles('integration/testdata/download.sh') }}

      - name: Download satellite data
        run: bash integration/testdata/download.sh

      - name: Run real data tests
        run: go test -race -count=1 -timeout 600s -v ./integration/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums-sha256.txt

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
